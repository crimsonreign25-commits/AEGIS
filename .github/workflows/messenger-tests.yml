name: AEGIS Messenger and Backend Tests

on:
  push:
    branches:
      - messenger-security-test
    paths:
      - 'app.js'
      - 'message-crypto.mjs'
      - 'message-crypto.test.mjs'
      - 'messenger-transport.mjs'
      - 'messenger-transport.test.mjs'
      - 'secure-share.mjs'
      - 'secure-share.test.mjs'
      - 'test.mjs'
      - 'build.mjs'
      - 'package.json'
      - 'backend/**'
      - '.github/workflows/messenger-tests.yml'
  pull_request:
    branches:
      - main
      - messenger-security-test
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install root dependencies
        run: npm install

      - name: Run frontend, secure-share, and Messenger tests
        run: npm test

      - name: Build production PWA
        run: npm run build

      - name: Install backend dependencies
        run: npm --prefix backend install

      - name: Run backend tests
        run: npm run test:backend
